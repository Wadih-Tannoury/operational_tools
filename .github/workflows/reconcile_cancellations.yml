name: Reconcile cancellations

# Follows up on the cancellations the warehouse workflow has already sent.
# Reads nothing but the ledger,
# `tlg-business-intelligence-prd`.til.warehouse_orders_cancellation_table, so it shares no
# folder and no file with the other two workflows and can run beside them.
#
#   1. confirm  a row sent to the warehouse is confirmed once
#               `tlg-wlfs-prd`.til.prd_shipmentStatus carries a CANCELLED event
#               with exactly its shipment_items
#   2. resend   a row still unconfirmed 24h after it was sent gets the CANCEL
#               event again, and its counter goes up by one
#   3. kibo     a confirmed row is cancelled in Kibo, in the shipment of its
#               order that is READY, BACKORDER or CUSTOMER_CARE
#
# Writes a log in warehouse/logs/reconcile-*. Runs hourly and on demand.

on:
  schedule:
    # Every hour at :17, away from the top of the hour so it does not queue
    # behind everything else that runs on the hour.
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: resolve and report, send nothing and write nothing"
        type: boolean
        default: false
      resend_after_hours:
        description: "Hours a cancellation may go unconfirmed before it is sent again"
        type: string
        default: "24"
      cancel_target_statuses:
        description: "Kibo statuses a shipment must be in to be cancelled"
        type: string
        default: "READY,BACKORDER,CUSTOMER_CARE"
      no_item_match:
        description: "Cancel every shipment of the order in a target status, not only the ones carrying the row's items"
        type: boolean
        default: false
      skip_confirm:
        description: "Skip stage 1 (look for CANCELLED events)"
        type: boolean
        default: false
      skip_resend:
        description: "Skip stage 2 (resend to the warehouse)"
        type: boolean
        default: false
      skip_kibo:
        description: "Skip stage 3 (cancel in Kibo)"
        type: boolean
        default: false
      kibo_reason_code:
        description: "canceledReason.reasonCode on the Kibo cancellation"
        type: string
        default: "CustomerChangedTheirMind"
      kibo_host:
        description: "Kibo host suffix"
        type: string
        default: "tp3.mozu.com"
      limit:
        description: "Maximum rows per stage (0 = no limit)"
        type: string
        default: "0"

concurrency:
  # Its own group: this workflow must not queue behind a cancellation run, and a
  # cancellation run must not wait for it. Two copies of this one would fight
  # over the same ledger rows, so they are serialised against each other.
  group: reconcile-cancellations
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  reconcile:
    name: Confirm, resend and close the cancellations
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run
        env:
          BI_BIGQUERY_CREDS: ${{ secrets.BI_BIGQUERY_CREDS }}
          WLFS_BIGQUERY_CREDS: ${{ secrets.WLFS_BIGQUERY_CREDS }}
          KIBO_API_CREDS: ${{ secrets.KIBO_API_CREDS }}
          GXO_API_KEY: ${{ secrets.GXO_API_KEY }}
          KIBO_TENANT_MAP: ${{ vars.KIBO_TENANT_MAP }}
          GXO_URL: ${{ vars.GXO_URL }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_RESEND_AFTER_HOURS: ${{ inputs.resend_after_hours }}
          INPUT_CANCEL_TARGET_STATUSES: ${{ inputs.cancel_target_statuses }}
          INPUT_NO_ITEM_MATCH: ${{ inputs.no_item_match }}
          INPUT_SKIP_CONFIRM: ${{ inputs.skip_confirm }}
          INPUT_SKIP_RESEND: ${{ inputs.skip_resend }}
          INPUT_SKIP_KIBO: ${{ inputs.skip_kibo }}
          INPUT_KIBO_REASON_CODE: ${{ inputs.kibo_reason_code }}
          INPUT_HOST: ${{ inputs.kibo_host }}
          INPUT_LIMIT: ${{ inputs.limit }}
        run: |
          FLAGS=""
          if [ "$INPUT_DRY_RUN" = "true" ];       then FLAGS="$FLAGS --dry-run"; fi
          if [ "$INPUT_NO_ITEM_MATCH" = "true" ]; then FLAGS="$FLAGS --no-item-match"; fi
          if [ "$INPUT_SKIP_CONFIRM" = "true" ];  then FLAGS="$FLAGS --skip-confirm"; fi
          if [ "$INPUT_SKIP_RESEND" = "true" ];   then FLAGS="$FLAGS --skip-resend"; fi
          if [ "$INPUT_SKIP_KIBO" = "true" ];     then FLAGS="$FLAGS --skip-kibo"; fi
          python scripts/reconcile_cancellations.py \
            $FLAGS \
            --resend-after-hours "${INPUT_RESEND_AFTER_HOURS:-24}" \
            --cancel-target-statuses "${INPUT_CANCEL_TARGET_STATUSES:-READY,BACKORDER,CUSTOMER_CARE}" \
            --kibo-reason-code "${INPUT_KIBO_REASON_CODE:-CustomerChangedTheirMind}" \
            --host "${INPUT_HOST:-tp3.mozu.com}" \
            --limit "${INPUT_LIMIT:-0}"

      - name: Commit the logs
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A warehouse/logs
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "Reconciliation run $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]"
          # Another run may have pushed in the meantime; rebase and retry.
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected, rebasing (attempt $attempt)."
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            sleep $((attempt * 3))
          done
          echo "Could not push after 5 attempts." >&2
          exit 1

      - name: Upload the run log as an artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reconciliation-run-logs
          path: warehouse/logs/reconcile-*
          if-no-files-found: warn
          retention-days: 30
