name: Cancellations

# Picks up every CSV in input/, applies it to Kibo, writes a log in logs/ and
# moves the file to archive/ or error/. Runs on a schedule, on every push that
# adds a file to input/, and on demand.

on:
  schedule:
    # Every 15 minutes. Scheduled runs on GitHub are best effort and can be late.
    - cron: "*/15 * * * *"
  push:
    paths:
      - "input/**"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: resolve and report, send nothing to Kibo"
        type: boolean
        default: false
      reason_code:
        description: "Default canceledReason.reasonCode"
        type: string
        default: "CustomerChangedTheirMind"
      more_info:
        description: "Default canceledReason.moreInfo"
        type: string
        default: "Unspecified"
      send_notifications:
        description: "Let Kibo send the customer notifications"
        type: boolean
        default: true
      kibo_host:
        description: "Kibo host suffix"
        type: string
        default: "tp3.mozu.com"
      limit:
        description: "Maximum records to process (0 = no limit)"
        type: string
        default: "0"

concurrency:
  group: cancellations
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  process:
    name: Process the cancellation files
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Is there anything to do?
        id: scan
        run: |
          count=$(find input -maxdepth 1 -type f \( -name '*.csv' -o -name '*.txt' \) | wc -l)
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Found $count file(s) in input/."

      - name: Set up Python
        if: steps.scan.outputs.count != '0'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        if: steps.scan.outputs.count != '0'
        run: pip install -r requirements.txt

      - name: Run
        if: steps.scan.outputs.count != '0'
        env:
          BI_BIGQUERY_CREDS: ${{ secrets.BI_BIGQUERY_CREDS }}
          KIBO_API_CREDS: ${{ secrets.KIBO_API_CREDS }}
          # Optional repository variable, merged over the built-in brand -> tenant
          # map, e.g. {"XY": "40001"}. Leave unset to use the built-in map alone.
          KIBO_TENANT_MAP: ${{ vars.KIBO_TENANT_MAP }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_SEND_NOTIFICATIONS: ${{ inputs.send_notifications }}
          INPUT_REASON_CODE: ${{ inputs.reason_code }}
          INPUT_MORE_INFO: ${{ inputs.more_info }}
          INPUT_HOST: ${{ inputs.kibo_host }}
          INPUT_LIMIT: ${{ inputs.limit }}
        run: |
          DRY_RUN_FLAG=""
          if [ "$INPUT_DRY_RUN" = "true" ]; then DRY_RUN_FLAG="--dry-run"; fi
          NO_NOTIFY_FLAG=""
          if [ "$INPUT_SEND_NOTIFICATIONS" = "false" ]; then NO_NOTIFY_FLAG="--no-send-notifications"; fi
          python scripts/process_cancellations.py \
            $DRY_RUN_FLAG \
            $NO_NOTIFY_FLAG \
            --host "${INPUT_HOST:-tp3.mozu.com}" \
            --reason-code "${INPUT_REASON_CODE:-CustomerChangedTheirMind}" \
            --more-info "${INPUT_MORE_INFO:-Unspecified}" \
            --limit "${INPUT_LIMIT:-0}"

      - name: Commit the logs and the moved files
        if: always() && steps.scan.outputs.count != '0'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A input archive error logs
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "Cancellation run $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]"
          # Another run may have pushed in the meantime; rebase and retry.
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected, rebasing (attempt $attempt)."
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            sleep $((attempt * 3))
          done
          echo "Could not push after 5 attempts." >&2
          exit 1

      - name: Upload the run log as an artifact
        if: always() && steps.scan.outputs.count != '0'
        uses: actions/upload-artifact@v4
        with:
          name: cancellation-run-logs
          path: logs/run-*
          if-no-files-found: warn
          retention-days: 30
