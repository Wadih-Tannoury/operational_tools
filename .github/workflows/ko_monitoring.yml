name: KO monitoring

# Builds the KO monitoring dashboard dataset.
#
# The console commits the pending-monitoring CSV, the IMKO check workbook, or
# either one on its own, into ko_monitoring/input/ in a single commit, so one
# upload is one push and one run. Either file is a whole batch: each says
# something the other does not, and a run with only the workbook archives no
# GXO shipment for absence, because a CSV that was never uploaded is not
# evidence that a shipment has gone. The worker joins what it has, calls the
# shipment-documents
# API once per shipment to decide ko_fix_date, reads
# `tlg-business-intelligence-prd`.bi.wh_document_api_response for what the
# warehouse last tried, and then does two things with the result: writes
# ko_monitoring/output/latest.csv, and merges the rows into
# `tlg-business-intelligence-prd`.til.ko_operational_table — one row per
# shipment, updated rather than duplicated, with the shipments that have
# dropped out of the uploaded files marked ko_resolved. The dashboard reads the
# table; the CSV is the backup and the fallback. The uploaded files are then
# deleted: output/ and logs/ are the record of what a run saw, and nothing ever
# read them back.
#
# This queue is its own: nothing here touches input/ or warehouse/input/, so it
# runs beside the cancellation workflows.

on:
  push:
    paths:
      - "ko_monitoring/input/**"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: read the uploaded files and report, call nothing"
        type: boolean
        default: false
      join:
        description: "Which shipments the dashboard holds"
        type: choice
        options: ["outer", "csv", "inner"]
        default: "outer"
      label_check:
        description: "Which label formats count as printable"
        type: choice
        options: ["printable", "zpl", "any"]
        default: "printable"
      backfill:
        description: "Backfill: fill in oerodp, oms_shipment_number, ko_source, blocking_reason, order_submit_date, shipment_creation_date, fulfillment_status, location_provider and channel for every shipment in the operational table and the archive. Calls no documents API and changes no verdict"
        type: boolean
        default: false
      probe:
        description: "Diagnostic: comma-separated shipment numbers to call the documents API for, printing the request and response. Writes nothing."
        type: string
        default: ""
      bq_lookback_days:
        description: "Only read warehouse attempts from the last N days (0 = all)"
        type: string
        default: "0"
      limit:
        description: "Check at most N shipments (0 = all)"
        type: string
        default: "0"
      sleep:
        description: "Seconds between API calls"
        type: string
        default: "0.1"

concurrency:
  group: ko-monitoring
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: Build the KO monitoring dataset
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: What is in the queue?
        id: scan
        run: |
          mkdir -p ko_monitoring/input
          count=$(find ko_monitoring/input -maxdepth 1 -type f \
                    \( -name '*.csv' -o -name '*.xlsx' -o -name '*.xlsm' -o -name '*.txt' \) \
                    | wc -l)
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Found $count file(s) in ko_monitoring/input/."
          if [ "$count" = "0" ]; then
            echo "No upload: the run re-checks the shipments the table still has open."
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run
        env:
          # {"clientId": "...", "clientSecret": "..."} — the documents API.
          GET_DOCUMENTS_API_CREDENTIALS: ${{ secrets.GET_DOCUMENTS_API_CREDENTIALS }}
          # {"BEARER_TOKEN": "..."} — MODA's getlabel endpoint. Without it the
          # run still works; the MODA shipments are not checked and say so.
          MODA_GET_DOCUMENTS_API_CREDENTIALS: ${{ secrets.MODA_GET_DOCUMENTS_API_CREDENTIALS }}
          # Kibo, for the fulfilment status of GXO shipments the table has
          # none for. Without it those shipments are left as they are.
          KIBO_API_CREDS: ${{ secrets.KIBO_API_CREDS }}
          KIBO_TENANT_MAP: ${{ vars.KIBO_TENANT_MAP }}
          KIBO_HOST: ${{ vars.KIBO_HOST }}
          # The BI project, for wh_document_api_response. Without it the run
          # still builds the dashboard; last_tried_by_gxo_date stays empty.
          BI_BIGQUERY_CREDS: ${{ secrets.BI_BIGQUERY_CREDS }}
          # The warehouse's own project: monitoring.gxo_ko and
          # til.prd_shipmentStatus. Without it the run still builds the
          # dashboard; gxo_ko and the SHIPPED check are skipped.
          WLFS_BIGQUERY_CREDS: ${{ secrets.WLFS_BIGQUERY_CREDS }}
          # The mailbox, for GXO Carisio's daily backlog workbook. The same
          # pair the reporting system sends with; here they are used to read
          # over IMAP rather than to send. Without them the mailbox is not
          # searched, the run says so and carries on, and the workbook has to
          # be uploaded by hand as before.
          # The drop bucket: a Power Automate flow writes the day's
          # workbook here and the run collects it. Set the bucket and this
          # is used in preference to the mailbox. The service account is
          # GXO_BACKLOG_CREDS if set, otherwise WLFS_BIGQUERY_CREDS, which
          # the run already has.
          GXO_BACKLOG_BUCKET: ${{ vars.GXO_BACKLOG_BUCKET }}
          GXO_BACKLOG_PREFIX: ${{ vars.GXO_BACKLOG_PREFIX }}
          GXO_BACKLOG_CREDS: ${{ secrets.GXO_BACKLOG_CREDS }}
          # Set to 0 to leave the object in place after reading it.
          GXO_BACKLOG_DELETE: ${{ vars.GXO_BACKLOG_DELETE }}
          # Microsoft Graph, the supported way in. An app registration with
          # the Mail.Read application permission; the mailbox defaults to
          # SMTP_USERNAME. Set these three and Graph is used.
          GRAPH_TENANT_ID: ${{ secrets.GRAPH_TENANT_ID }}
          GRAPH_CLIENT_ID: ${{ secrets.GRAPH_CLIENT_ID }}
          GRAPH_CLIENT_SECRET: ${{ secrets.GRAPH_CLIENT_SECRET }}
          GRAPH_MAILBOX: ${{ vars.GRAPH_MAILBOX }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          # Only needed if the app password was copied with spaces in it.
          SMTP_REMOVE_PASSWORD_SPACES: ${{ vars.SMTP_REMOVE_PASSWORD_SPACES }}
          # Optional, to point the search somewhere other than the default
          # outlook.office365.com:993 / INBOX / the last 7 days.
          IMAP_HOST: ${{ vars.IMAP_HOST }}
          IMAP_FOLDER: ${{ vars.IMAP_FOLDER }}
          IMAP_SEARCH_DAYS: ${{ vars.IMAP_SEARCH_DAYS }}
          # Optional repository variables, to point a run at a test endpoint.
          GET_DOCUMENTS_AUTH_URL: ${{ vars.GET_DOCUMENTS_AUTH_URL }}
          GET_DOCUMENTS_URL: ${{ vars.GET_DOCUMENTS_URL }}
          MODA_GET_LABEL_URL: ${{ vars.MODA_GET_LABEL_URL }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_BACKFILL: ${{ inputs.backfill }}
          INPUT_PROBE: ${{ inputs.probe }}
          INPUT_JOIN: ${{ inputs.join }}
          INPUT_LABEL_CHECK: ${{ inputs.label_check }}
          INPUT_BQ_LOOKBACK_DAYS: ${{ inputs.bq_lookback_days }}
          INPUT_LIMIT: ${{ inputs.limit }}
          INPUT_SLEEP: ${{ inputs.sleep }}
        run: |
          DRY_RUN_FLAG=""
          if [ "$INPUT_DRY_RUN" = "true" ]; then DRY_RUN_FLAG="--dry-run"; fi
          BACKFILL_FLAG=""
          if [ "$INPUT_BACKFILL" = "true" ]; then BACKFILL_FLAG="--backfill"; fi
          PROBE_FLAG=""
          if [ -n "$INPUT_PROBE" ]; then PROBE_FLAG="--probe"; fi
          python scripts/build_ko_monitoring.py \
            $DRY_RUN_FLAG \
            $BACKFILL_FLAG \
            $PROBE_FLAG ${INPUT_PROBE:+"$INPUT_PROBE"} \
            --join "${INPUT_JOIN:-outer}" \
            --label-check "${INPUT_LABEL_CHECK:-printable}" \
            --bq-lookback-days "${INPUT_BQ_LOOKBACK_DAYS:-0}" \
            --limit "${INPUT_LIMIT:-0}" \
            --sleep "${INPUT_SLEEP:-0.1}"

      - name: Commit the dataset, the logs and the moved files
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A ko_monitoring
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "KO monitoring run $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]"
          # Another run may have pushed in the meantime; rebase and retry.
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected, rebasing (attempt $attempt)."
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            sleep $((attempt * 3))
          done
          echo "Could not push after 5 attempts." >&2
          exit 1

      - name: Upload the dataset and the log as artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ko-monitoring-run
          path: |
            ko_monitoring/output/*
            ko_monitoring/logs/run-*
          if-no-files-found: warn
          retention-days: 30
