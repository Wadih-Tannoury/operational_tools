name: Warehouse cancellations

# Picks up every CSV in warehouse/input/ and sends a CANCEL event to the GXO
# endpoint for each shipment. A row that names a product is sent only when that
# product is the whole shipment; otherwise nothing is sent anywhere.
# A row whose cancelInKibo column says yes is then cancelled in Kibo as well,
# but only after the warehouse has accepted the event — and only when the Kibo
# step is switched on for the run, which it is not by default: the allow_kibo
# checkbox on a manual run, or the ALLOW_KIBO_CANCELLATIONS repository variable
# on a push. Nothing is sent at all
# for a shipmentOrderNumber that answers for more than one shipment still in
# play — see "When one number means two shipments" in the README.
# Writes a log in warehouse/logs/ and moves the file to warehouse/archive/
# or warehouse/error/. Runs on every push that adds a file to warehouse/input/,
# and on demand. The Kibo workflow owns input/ at the root; the two never share
# a folder, so they can run at the same time.

on:
  push:
    paths:
      - "warehouse/input/**"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: resolve and report, send nothing to the warehouse"
        type: boolean
        default: false
      reason_message:
        description: "Default data.reasonMessage"
        type: string
        default: "Cancelled"
      update_reason:
        description: "data.updateReason"
        type: string
        default: "external"
      no_product_check:
        description: "Skip the Kibo read (rows with a productId then fail)"
        type: boolean
        default: false
      allow_kibo:
        description: "Allow the Kibo step at all (off by default: rows asking for it are cancelled at the warehouse only)"
        type: boolean
        default: false
      cancel_in_kibo:
        description: "Also cancel in Kibo (warehouse first) where a row leaves cancelInKibo empty"
        type: boolean
        default: false
      kibo_reason_code:
        description: "canceledReason.reasonCode on the Kibo cancellation"
        type: string
        default: "CustomerChangedTheirMind"
      kibo_host:
        description: "Kibo host suffix, used only by the product check"
        type: string
        default: "tp3.mozu.com"
      limit:
        description: "Maximum records to process (0 = no limit)"
        type: string
        default: "0"

concurrency:
  group: warehouse-cancellations
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  process:
    name: Send the warehouse cancellations
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Is there anything to do?
        id: scan
        run: |
          count=$(find warehouse/input -maxdepth 1 -type f \( -name '*.csv' -o -name '*.txt' \) | wc -l)
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Found $count file(s) in warehouse/input/."

      - name: Set up Python
        if: steps.scan.outputs.count != '0'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        if: steps.scan.outputs.count != '0'
        run: pip install -r requirements.txt

      - name: Run
        if: steps.scan.outputs.count != '0'
        env:
          WLFS_BIGQUERY_CREDS: ${{ secrets.WLFS_BIGQUERY_CREDS }}
          GXO_API_KEY: ${{ secrets.GXO_API_KEY }}
          # Required for every run: Kibo is read for every record to rule out a
          # shipmentOrderNumber carrying more than one shipment still in play,
          # as well as for the product check and the Kibo cancellation.
          KIBO_API_CREDS: ${{ secrets.KIBO_API_CREDS }}
          # The cancellation ledger lives in the BI project. Without it the run
          # still cancels, but nothing is written down and the reconciliation
          # workflow has nothing to follow up on.
          BI_BIGQUERY_CREDS: ${{ secrets.BI_BIGQUERY_CREDS }}
          # Optional repository variables.
          KIBO_TENANT_MAP: ${{ vars.KIBO_TENANT_MAP }}
          GXO_URL: ${{ vars.GXO_URL }}
          # The Kibo step is off unless it is switched on. On a manual run the
          # checkbox decides; on a push the repository variable does, and an
          # unset variable means off.
          VAR_ALLOW_KIBO: ${{ vars.ALLOW_KIBO_CANCELLATIONS }}
          INPUT_ALLOW_KIBO: ${{ inputs.allow_kibo }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_NO_PRODUCT_CHECK: ${{ inputs.no_product_check }}
          INPUT_CANCEL_IN_KIBO: ${{ inputs.cancel_in_kibo }}
          INPUT_KIBO_REASON_CODE: ${{ inputs.kibo_reason_code }}
          INPUT_REASON_MESSAGE: ${{ inputs.reason_message }}
          INPUT_UPDATE_REASON: ${{ inputs.update_reason }}
          INPUT_HOST: ${{ inputs.kibo_host }}
          INPUT_LIMIT: ${{ inputs.limit }}
        run: |
          DRY_RUN_FLAG=""
          if [ "$INPUT_DRY_RUN" = "true" ]; then DRY_RUN_FLAG="--dry-run"; fi
          NO_CHECK_FLAG=""
          if [ "$INPUT_NO_PRODUCT_CHECK" = "true" ]; then NO_CHECK_FLAG="--no-product-check"; fi
          KIBO_FLAG=""
          if [ "$INPUT_CANCEL_IN_KIBO" = "true" ]; then KIBO_FLAG="--cancel-in-kibo"; fi
          ALLOW_KIBO="$INPUT_ALLOW_KIBO"
          if [ -z "$ALLOW_KIBO" ]; then ALLOW_KIBO="$VAR_ALLOW_KIBO"; fi
          ALLOW_KIBO_FLAG=""
          if [ "$ALLOW_KIBO" = "true" ]; then
            ALLOW_KIBO_FLAG="--allow-kibo"
            echo "The Kibo step is allowed for this run."
          else
            echo "The Kibo step is off: rows asking for it are cancelled at the warehouse only."
          fi
          python scripts/process_warehouse_cancellations.py \
            $DRY_RUN_FLAG \
            $NO_CHECK_FLAG \
            $ALLOW_KIBO_FLAG \
            $KIBO_FLAG \
            --kibo-reason-code "${INPUT_KIBO_REASON_CODE:-CustomerChangedTheirMind}" \
            --host "${INPUT_HOST:-tp3.mozu.com}" \
            --reason-message "${INPUT_REASON_MESSAGE:-Cancelled}" \
            --update-reason "${INPUT_UPDATE_REASON:-external}" \
            --limit "${INPUT_LIMIT:-0}"

      - name: Commit the logs and the moved files
        if: always() && steps.scan.outputs.count != '0'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A warehouse
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "Warehouse cancellation run $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]"
          # Another run may have pushed in the meantime; rebase and retry.
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected, rebasing (attempt $attempt)."
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            sleep $((attempt * 3))
          done
          echo "Could not push after 5 attempts." >&2
          exit 1

      - name: Upload the run log as an artifact
        if: always() && steps.scan.outputs.count != '0'
        uses: actions/upload-artifact@v4
        with:
          name: warehouse-cancellation-run-logs
          path: warehouse/logs/run-*
          if-no-files-found: warn
          retention-days: 30
